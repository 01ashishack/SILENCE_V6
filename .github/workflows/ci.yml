name: CI

# Audit Wave 9: continuous checks for every push/PR — static analysis, unit/
# integration tests, a release-mode build, and a schema-drift guard (ensures
# every migration object is folded into the canonical supabase_schema.sql).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze, test & schema-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Schema-drift check (migrations folded into canonical schema)
        run: dart run tool/check_schema_drift.dart

      - name: Static analysis
        run: flutter analyze

      - name: Unit & integration tests
        run: flutter test

  build-android:
    name: Build Android (release, debug-signed)
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No keystore in CI → the release build uses the debug-signing fallback.
      # We do NOT set requireReleaseSigning here, so this validates that the app
      # compiles end-to-end. Production signing happens in a separate, secret-
      # gated release pipeline (see android/app/build.gradle.kts).
      - name: Build release APK (compile check)
        run: flutter build apk --release
